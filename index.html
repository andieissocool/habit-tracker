<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f5f0;
    --grid: #c9c6bf;
    --margin: #d98b6a;
    --ink: #2f2c2a;
    --pencil: #8c8780;
  }
  * { box-sizing: border-box; }
  /* ganze Seite als gepunktetes Bullet-Journal-Papier */
  body {
    margin: 0;
    padding: 24px 16px;
    min-height: 100vh;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--grid) 1.2px, transparent 1.6px);
    background-size: 22px 22px;
    background-position: 11px 11px;
    color: var(--ink);
    font-family: "Patrick Hand", "Comic Sans MS", cursive;
    font-size: 18px;
  }
  .page {
    max-width: 1040px;
    margin: 0 auto;
    padding: 12px 0 24px;
  }
  /* Kalender links, Habits rechts */
  .spread {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
    gap: 40px;
    align-items: start;
  }
  h2 {
    margin: 4px 0 12px;
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: 2rem;
    line-height: 1;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 {
    flex: 1;
    margin: 0;
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: 2.6rem;
    line-height: 1;
  }
  .nav {
    background: none;
    border: none;
    font: inherit;
    font-size: 1.6rem;
    color: var(--pencil);
    cursor: pointer;
    padding: 0 6px;
  }
  .nav:hover { color: var(--ink); }

  /* Habits */
  .habits {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }
  .habit {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 10px;
    border: 2px solid transparent;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    background: none;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
  }
  .habit.active { border-color: var(--ink); }
  .habit .dot { width: 14px; height: 14px; }
  .habit .del {
    color: var(--pencil);
    font-size: .9em;
    margin-left: 2px;
  }
  .habit .del:hover { color: #c0392b; }

  form.add {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  form.add input[type=text] {
    width: 140px;
    border: none;
    border-bottom: 2px dashed var(--pencil);
    background: transparent;
    font: inherit;
    color: var(--ink);
    outline: none;
  }
  form.add input[type=color] {
    width: 26px; height: 26px;
    border: none; padding: 0; background: none; cursor: pointer;
  }
  form.add button {
    border: none; background: none; font: inherit; font-size: 1.4rem;
    color: var(--ink); cursor: pointer; line-height: 1;
  }

  /* Kalender */
  .weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .weekdays div {
    text-align: center;
    font-family: "Caveat", cursive;
    font-size: 1.3rem;
    color: var(--pencil);
  }
  .day {
    min-height: 76px;
    padding: 4px 6px;
    border: 1.5px solid rgba(43,58,85,.35);
    border-radius: 3px 6px 4px 7px;
    background: rgba(247,245,240,.55);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  .day:hover { border-color: var(--ink); }
  .day.empty { border: none; background: none; cursor: default; }
  .day.today { border: 2.5px solid var(--margin); }
  .day .num { font-size: 1rem; }
  .day .dots {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: auto;
  }
  .dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    /* leicht unregelmäßig wie mit Stift gemalt */
    border-radius: 48% 52% 45% 55% / 55% 45% 52% 48%;
  }

  /* Jahrestrend */
  .trend { margin-top: 36px; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin-bottom: 6px;
    font-size: .95rem;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .grid { stroke: var(--grid); stroke-dasharray: 3 4; }
  .chart .label { fill: var(--pencil); font-size: 15px; }
  .chart .cross { stroke: var(--pencil); stroke-dasharray: 2 3; }
  .chart .empty-note { fill: var(--pencil); font-size: 17px; }
  .tooltip {
    position: absolute;
    top: 0;
    z-index: 1;
    pointer-events: none;
    padding: 6px 10px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    font-size: .9rem;
    line-height: 1.35;
    white-space: nowrap;
  }
  .tooltip b { font-family: "Caveat", cursive; font-size: 1.2rem; }
  .tooltip div { display: flex; align-items: center; gap: 6px; }
  .tooltip .val { margin-left: auto; padding-left: 12px; color: var(--pencil); }

  .hint {
    margin-top: 18px;
    color: var(--pencil);
    font-size: .95rem;
  }
  .status { min-height: 1.4em; color: #c0392b; font-size: .95rem; margin: 8px 0 0; }

  .login { max-width: 360px; padding-top: 12px; }
  .login p { margin: 0 0 12px; }
  .login form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .login input {
    flex: 1;
    min-width: 0;
    border: none;
    border-bottom: 2px dashed var(--pencil);
    background: transparent;
    font: inherit;
    color: var(--ink);
    outline: none;
  }
  .login button, .logout {
    border: 2px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    background: none;
    font: inherit;
    color: var(--ink);
    padding: 2px 12px;
    cursor: pointer;
  }
  .logout { border: none; color: var(--pencil); font-size: .95rem; padding: 0; }
  .logout:hover { color: var(--ink); }
  .footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }

  /* schmal: Habits über dem Kalender, damit man zuerst eins auswählt */
  @media (max-width: 760px) {
    .spread { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .sidebar { order: -1; }
    .habits { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  }

  @media (max-width: 560px) {
    h1 { font-size: 2rem; }
    .day { min-height: 56px; padding: 2px 3px; }
    .dot { width: 9px; height: 9px; }
    .weekdays, .days { gap: 3px; }
  }
</style>
</head>
<body>
  <main class="page">
    <section id="login" class="login" hidden>
      <h1>Habit Tracker</h1>
      <p>Melde dich mit deiner E-Mail an – du bekommst einen Link zum Einloggen.</p>
      <form id="login-form">
        <input type="email" id="email" required placeholder="deine@email.de" autocomplete="email">
        <button type="submit">Link senden</button>
      </form>
    </section>

    <section id="app" hidden>
      <div class="spread">
        <div class="calendar">
          <header>
            <button class="nav" id="prev" aria-label="Vorheriger Monat">&larr;</button>
            <h1 id="title"></h1>
            <button class="nav" id="next" aria-label="Nächster Monat">&rarr;</button>
          </header>
          <div class="weekdays">
            <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
          </div>
          <div class="days" id="days"></div>

          <section class="trend">
            <h2>Trend <span id="trend-year"></span></h2>
            <div class="legend" id="legend"></div>
            <div class="chart" id="chart"></div>
          </section>
        </div>

        <aside class="sidebar">
          <h2>Habits</h2>
          <div class="habits" id="habits"></div>
        </aside>
      </div>

      <div class="footer">
        <p class="hint">Habit auswählen, dann auf einen Tag klicken, um einen Punkt zu setzen oder zu entfernen.</p>
        <button class="logout" id="logout">abmelden (<span id="who"></span>)</button>
      </div>
    </section>

    <p class="status" id="status" role="status"></p>
  </main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const $ = (id) => document.getElementById(id);

  const today = new Date();
  const view = { year: today.getFullYear(), month: today.getMonth() };

  let db = null;
  let userId;               // undefined = noch unbekannt, null = abgemeldet
  let habits = [];          // [{ id, name, color }]
  let marks = new Map();    // "2026-09-29" -> Set(habitId), ganzes Jahr view.year
  let activeHabit = null;
  let loadToken = 0;

  function showStatus(msg, isError = true) {
    const el = $("status");
    el.textContent = msg;
    el.style.color = isError ? "" : "var(--ink)";
  }

  function fail(error) {
    console.error(error);
    showStatus("Fehler: " + (error.message || error));
  }

  function dateKey(y, m, d) {
    return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }

  function daysInMonth(y, m) {
    return new Date(y, m + 1, 0).getDate();
  }

  // --- Daten ---

  async function loadHabits() {
    const { data, error } = await db.from("habits").select("id,name,color").order("created_at");
    if (error) return fail(error);
    habits = data;
    if (!habits.some(h => h.id === activeHabit)) activeHabit = habits[0]?.id ?? null;
  }

  // Lädt alle Punkte des angezeigten Jahres (für Kalender und Trend).
  // Supabase liefert höchstens 1000 Zeilen pro Abfrage, daher seitenweise.
  async function loadMarks() {
    const token = ++loadToken;
    const { year } = view;
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await db.from("marks")
        .select("habit_id,day")
        .gte("day", dateKey(year, 0, 1))
        .lte("day", dateKey(year, 11, 31))
        .order("day").order("habit_id")
        .range(from, from + 999);
      if (token !== loadToken) return; // inzwischen anderes Jahr gewählt
      if (error) return fail(error);
      rows.push(...data);
      if (data.length < 1000) break;
    }
    marks = new Map();
    for (const m of rows) {
      if (!marks.has(m.day)) marks.set(m.day, new Set());
      marks.get(m.day).add(m.habit_id);
    }
    renderDays();
  }

  async function addHabit(name, color) {
    const { data, error } = await db.from("habits")
      .insert({ name, color })
      .select("id,name,color")
      .single();
    if (error) return fail(error);
    habits.push(data);
    activeHabit = data.id;
    render();
  }

  async function deleteHabit(id) {
    const { error } = await db.from("habits").delete().eq("id", id);
    if (error) return fail(error);
    habits = habits.filter(h => h.id !== id);
    for (const set of marks.values()) set.delete(id);
    if (activeHabit === id) activeHabit = habits[0]?.id ?? null;
    render();
  }

  async function toggle(key) {
    if (!activeHabit) return showStatus("Lege zuerst ein Habit an.");
    const id = activeHabit;
    const set = marks.get(key) ?? new Set();
    const had = set.has(id);
    // sofort anzeigen, bei Fehler zurücknehmen
    had ? set.delete(id) : set.add(id);
    marks.set(key, set);
    renderDays();

    const { error } = had
      ? await db.from("marks").delete().eq("habit_id", id).eq("day", key)
      : await db.from("marks").upsert({ habit_id: id, day: key }, { ignoreDuplicates: true });
    if (error) {
      had ? set.add(id) : set.delete(id);
      renderDays();
      fail(error);
    }
  }

  // --- Anzeige ---

  function renderHabits() {
    const el = $("habits");
    el.innerHTML = "";
    for (const h of habits) {
      const btn = document.createElement("button");
      btn.className = "habit" + (h.id === activeHabit ? " active" : "");
      btn.innerHTML = `<span class="dot"></span><span></span><span class="del" title="Löschen">×</span>`;
      btn.children[0].style.background = h.color;
      btn.children[1].textContent = h.name;
      btn.onclick = (e) => {
        if (e.target.classList.contains("del")) {
          if (!btn.dataset.confirm) {
            btn.dataset.confirm = "1";
            e.target.textContent = "löschen?";
            return;
          }
          deleteHabit(h.id);
        } else {
          activeHabit = h.id;
          render();
        }
      };
      el.appendChild(btn);
    }

    const form = document.createElement("form");
    form.className = "add";
    form.innerHTML = `
      <input type="color" value="#9b59b6" aria-label="Farbe">
      <input type="text" placeholder="neues Habit…" maxlength="24">
      <button type="submit" aria-label="Hinzufügen">+</button>`;
    form.onsubmit = (e) => {
      e.preventDefault();
      const name = form.querySelector("input[type=text]").value.trim();
      if (name) addHabit(name, form.querySelector("input[type=color]").value);
    };
    el.appendChild(form);
  }

  function renderDays() {
    const { year, month } = view;
    $("title").textContent = `${MONTHS[month]} ${year}`;
    const el = $("days");
    el.innerHTML = "";

    const offset = (new Date(year, month, 1).getDay() + 6) % 7; // Montag zuerst
    const colors = Object.fromEntries(habits.map(h => [h.id, h.color]));

    for (let i = 0; i < offset; i++) {
      el.appendChild(Object.assign(document.createElement("div"), { className: "day empty" }));
    }
    for (let d = 1; d <= daysInMonth(year, month); d++) {
      const key = dateKey(year, month, d);
      const cell = document.createElement("div");
      cell.className = "day";
      if (year === today.getFullYear() && month === today.getMonth() && d === today.getDate()) {
        cell.classList.add("today");
      }
      cell.innerHTML = `<span class="num">${d}</span><div class="dots"></div>`;
      for (const id of marks.get(key) ?? []) {
        if (!colors[id]) continue;
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = colors[id];
        cell.lastChild.appendChild(dot);
      }
      cell.onclick = () => toggle(key);
      el.appendChild(cell);
    }
    renderChart();
  }

  // Farben kommen aus der Datenbank – nur echte Hex-Werte ins SVG übernehmen.
  function safeColor(c) {
    return /^#[0-9a-f]{6}$/i.test(c) ? c : "#8c8780";
  }

  // Pro Habit und Monat: erledigte Tage und mögliche Tage (bis heute).
  function yearStats() {
    const { year } = view;
    const done = new Map(habits.map(h => [h.id, Array(12).fill(0)]));
    for (const [key, set] of marks) {
      const m = Number(key.slice(5, 7)) - 1;
      for (const id of set) {
        const counts = done.get(id);
        if (counts) counts[m]++;
      }
    }
    const possible = [];
    for (let m = 0; m < 12; m++) {
      const start = new Date(year, m, 1);
      if (start > today) possible.push(0);
      else if (year === today.getFullYear() && m === today.getMonth()) possible.push(today.getDate());
      else possible.push(daysInMonth(year, m));
    }
    return { done, possible };
  }

  function renderChart() {
    $("trend-year").textContent = view.year;
    const el = $("chart");
    const legend = $("legend");
    el.innerHTML = "";
    legend.innerHTML = "";

    const W = el.clientWidth || 640, H = 220;
    const pad = { l: 44, r: 12, t: 10, b: 28 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const x = (m) => pad.l + (m + 0.5) * iw / 12;
    const y = (v) => pad.t + (1 - v) * ih;
    const { done, possible } = yearStats();

    let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Anteil erledigter Tage pro Monat im Jahr ${view.year}">`;
    for (const v of [0, 0.5, 1]) {
      svg += `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/>`;
      svg += `<text class="label" x="${pad.l - 8}" y="${y(v) + 5}" text-anchor="end">${v * 100}%</text>`;
    }
    MONTHS.forEach((name, m) => {
      svg += `<text class="label" x="${x(m)}" y="${H - 6}" text-anchor="middle">${name.slice(0, 3)}</text>`;
    });
    svg += `<line class="cross" id="cross" y1="${pad.t}" y2="${pad.t + ih}" visibility="hidden"/>`;

    for (const h of habits) {
      const color = safeColor(h.color);
      // abgeschlossene Monate durchgezogen, der laufende Monat gestrichelt
      const pts = [];
      for (let m = 0; m < 12; m++) {
        if (possible[m]) pts.push({ m, px: x(m), py: y(done.get(h.id)[m] / possible[m]) });
      }
      const running = pts.length && view.year === today.getFullYear() && pts.at(-1).m === today.getMonth();
      const solid = running ? pts.slice(0, -1) : pts;
      const line = (p) => p.map((q, i) => `${i ? "L" : "M"}${q.px},${q.py}`).join(" ");
      const stroke = `fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
      if (solid.length > 1) svg += `<path d="${line(solid)}" ${stroke}/>`;
      if (running && pts.length > 1) svg += `<path d="${line(pts.slice(-2))}" ${stroke} stroke-dasharray="4 5"/>`;
      for (const q of pts) {
        svg += `<circle cx="${q.px}" cy="${q.py}" r="4" fill="${color}" stroke="var(--paper)" stroke-width="2"/>`;
      }

      const item = document.createElement("span");
      item.innerHTML = `<span class="dot"></span><span></span>`;
      item.children[0].style.background = color;
      item.children[1].textContent = h.name;
      legend.appendChild(item);
    }

    if (!habits.length) {
      svg += `<text class="empty-note" x="${pad.l + iw / 2}" y="${pad.t + ih / 2}" text-anchor="middle">Lege ein Habit an, um hier deinen Verlauf zu sehen.</text>`;
    }
    // unsichtbare Spalten pro Monat für den Hover-Tooltip
    for (let m = 0; m < 12; m++) {
      svg += `<rect data-m="${m}" x="${pad.l + m * iw / 12}" y="0" width="${iw / 12}" height="${H}" fill="transparent"/>`;
    }
    el.innerHTML = svg + "</svg>";

    const tip = document.createElement("div");
    tip.className = "tooltip";
    tip.hidden = true;
    el.appendChild(tip);
    const cross = el.querySelector("#cross");

    el.querySelectorAll("rect[data-m]").forEach(r => {
      r.addEventListener("pointerenter", () => {
        const m = Number(r.dataset.m);
        if (!habits.length || !possible[m]) return;
        tip.innerHTML = "";
        const head = document.createElement("b");
        head.textContent = `${MONTHS[m]} ${view.year}`;
        tip.appendChild(head);
        for (const h of habits) {
          const n = done.get(h.id)[m];
          const row = document.createElement("div");
          row.innerHTML = `<span class="dot"></span><span></span><span class="val"></span>`;
          row.children[0].style.background = safeColor(h.color);
          row.children[1].textContent = h.name;
          row.children[2].textContent = `${n}/${possible[m]} Tage · ${Math.round(n / possible[m] * 100)}%`;
          tip.appendChild(row);
        }
        cross.setAttribute("x1", x(m));
        cross.setAttribute("x2", x(m));
        cross.setAttribute("visibility", "visible");
        tip.hidden = false;
        // rechts vom Monat, sonst links davon – und nie über den Rand hinaus
        const w = tip.offsetWidth;
        const left = x(m) + 14 + w <= W ? x(m) + 14 : x(m) - 14 - w;
        tip.style.left = `${Math.max(0, Math.min(left, W - w))}px`;
      });
    });
    el.querySelector("svg").addEventListener("pointerleave", () => {
      tip.hidden = true;
      cross.setAttribute("visibility", "hidden");
    });
  }

  function render() {
    renderHabits();
    renderDays();
  }

  function changeMonth(delta) {
    const d = new Date(view.year, view.month + delta, 1);
    const yearChanged = d.getFullYear() !== view.year;
    view.year = d.getFullYear();
    view.month = d.getMonth();
    renderDays();
    if (yearChanged) loadMarks(); // innerhalb eines Jahres sind die Punkte schon geladen
  }

  // --- Anmeldung ---

  async function onSession(session) {
    const uid = session?.user.id ?? null;
    if (uid === userId) return; // z. B. nur Token erneuert
    userId = uid;
    $("login").hidden = !!uid;
    $("app").hidden = !uid;
    showStatus("");
    if (!uid) return;
    $("who").textContent = session.user.email;
    habits = [];
    marks = new Map();
    await loadHabits();
    render();
    loadMarks();
  }

  function init() {
    const cfg = window.HABIT_CONFIG || {};
    if (!cfg.url || cfg.url.includes("DEIN-PROJEKT")) {
      showStatus("Bitte zuerst Supabase-URL und Key in config.js eintragen.");
      return;
    }
    db = supabase.createClient(cfg.url, cfg.anonKey);

    // Supabase-Aufrufe nicht direkt im Callback ausführen (Empfehlung von supabase-js)
    db.auth.onAuthStateChange((_event, session) => setTimeout(() => onSession(session), 0));

    $("login-form").onsubmit = async (e) => {
      e.preventDefault();
      if (location.protocol === "file:") {
        return showStatus("Der Login-Link funktioniert nur, wenn die Seite über http(s) geöffnet wird (siehe README).");
      }
      const email = $("email").value.trim();
      const { error } = await db.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: location.origin + location.pathname },
      });
      if (error) return fail(error);
      showStatus("Link gesendet – schau in dein Postfach.", false);
    };

    $("logout").onclick = () => db.auth.signOut();
    $("prev").onclick = () => changeMonth(-1);
    $("next").onclick = () => changeMonth(1);
    window.addEventListener("resize", () => { if (userId) renderChart(); });
  }

  init();
</script>
</body>
</html>
